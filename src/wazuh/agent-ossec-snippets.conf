<!--
  Snippets added to the Wazuh AGENT config on web-dmz:
  /var/ossec/etc/ossec.conf  (inside <ossec_config>)

  Prereq for command monitoring (agent):
  /var/ossec/etc/local_internal_options.conf  ->  logcollector.remote_commands=1
-->

<!-- honeypot JSON logs -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/honeynet/fake_mysql.log</location>
</localfile>
<localfile>
  <log_format>json</log_format>
  <location>/var/log/honeynet/fake_ssh.log</location>
</localfile>

<!-- service health command monitoring (every 60s) -->
<localfile>
  <log_format>command</log_format>
  <command>for s in honey-mysql honey-ssh firewall-siege; do echo "service $s $(systemctl is-active $s)"; done</command>
  <alias>lab_service_status</alias>
  <frequency>60</frequency>
</localfile>
